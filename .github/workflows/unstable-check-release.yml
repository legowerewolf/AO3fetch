name: Checks (unstable, latest release)

on:
  schedule:
    - cron: 0 0 * * FRI
  push:
    paths:
      - .github/workflows/unstable-check-release.yml

permissions: read-all

jobs:
  vulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Query latest release
        id: release_metadata
        run: >
          latest_release_version=gh api $GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest | jq ".tag_name"
          echo "latest_release_version=$latest_release_version" >> GITHUB_OUTPUT

      - name: Set up repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{steps.release_metadata.outputs.latest_release_version}}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Govulncheck
        run: govulncheck ./...
